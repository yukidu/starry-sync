name: Deploy Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starsvideosync-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Initialize or update D1 schema
        run: npx wrangler d1 execute starsvideosync_db --remote --file=./schema.sql

      - name: Ensure token encryption key
        shell: bash
        env:
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
        run: |
          set -euo pipefail
          if npx wrangler secret list | grep -q '"name": "TOKEN_ENCRYPTION_KEY"'; then
            echo "TOKEN_ENCRYPTION_KEY already exists in Cloudflare; keeping the existing key."
          elif [ -n "${TOKEN_ENCRYPTION_KEY:-}" ]; then
            printf '%s' "$TOKEN_ENCRYPTION_KEY" | npx wrangler secret put TOKEN_ENCRYPTION_KEY
          else
            openssl rand -base64 32 | tr -d '\n' | npx wrangler secret put TOKEN_ENCRYPTION_KEY
            echo "Generated TOKEN_ENCRYPTION_KEY directly in the deployment runner and stored it in Cloudflare."
          fi

      - name: Sync platform secrets to Cloudflare
        shell: bash
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GJW_CLIENT_ID: ${{ secrets.GJW_CLIENT_ID }}
          GJW_CLIENT_SECRET: ${{ secrets.GJW_CLIENT_SECRET }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
        run: |
          set -euo pipefail
          put_if_present() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "Synced $name to Cloudflare."
            else
              echo "Skipped $name because the GitHub secret is not configured yet."
            fi
          }
          put_if_present ADMIN_EMAIL "$ADMIN_EMAIL"
          put_if_present GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          put_if_present GOOGLE_CLIENT_SECRET "$GOOGLE_CLIENT_SECRET"
          put_if_present GJW_CLIENT_ID "$GJW_CLIENT_ID"
          put_if_present GJW_CLIENT_SECRET "$GJW_CLIENT_SECRET"
          put_if_present META_APP_ID "$META_APP_ID"
          put_if_present META_APP_SECRET "$META_APP_SECRET"
          put_if_present THREADS_APP_ID "$THREADS_APP_ID"
          put_if_present THREADS_APP_SECRET "$THREADS_APP_SECRET"

      - name: Deploy production Worker
        run: npx wrangler deploy
