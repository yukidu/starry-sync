name = "starsvideosync"
main = "worker/aiRouter.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "starsvideosync_db"
database_id = "4df9cafb-0659-435a-ac67-ca57c4d82f78"

[ai]
binding = "AI"

[vars]
APP_NAME = "StarsVideoSync"
ADMIN_EMAIL = "yukidu@gmail.com"
META_GRAPH_VERSION = "v26.0"
